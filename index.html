<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Trading - Professional Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1a12; color: #e2e8f0; font-family: sans-serif; }
        .card-bg { background-color: #13271b; border: 1px solid #1e3a29; }
        .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-green:hover { background: linear-gradient(135deg, #059669, #047857); }
    </style>
</head>
<body class="pb-20">

    <!-- Header / Navbar -->
    <div class="card-bg p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-lg">MH</div>
            <div>
                <h1 class="font-bold text-sm text-emerald-400">Mohammad Hasnain</h1>
                <p class="text-xs text-gray-400">Pro Trader Dashboard</p>
            </div>
        </div>
        <button class="text-gray-400 hover:text-white"><i class="fa-solid fa-bell text-xl"></i></button>
    </div>

    <div class="p-4 space-y-4 max-w-md mx-auto">

        <!-- Balance Card -->
        <div class="card-bg p-5 rounded-2xl relative overflow-hidden">
            <p class="text-xs text-gray-400 uppercase tracking-wider">Available Balance</p>
            <h2 class="text-3xl font-extrabold text-emerald-400 mt-1">Rs 2,400.00</h2>
            
            <div class="grid grid-cols-2 gap-3 mt-5">
                <button onclick="openModal('depositModal')" class="btn-green py-2.5 rounded-xl text-center font-semibold text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-down"></i> Deposit
                </button>
                <button onclick="openModal('withdrawModal')" class="bg-slate-800 border border-slate-700 py-2.5 rounded-xl text-center font-semibold text-sm flex items-center justify-center gap-2 hover:bg-slate-700">
                    <i class="fa-solid fa-arrow-up"></i> Withdraw
                </button>
            </div>
        </div>

        <!-- Next Profit Timer -->
        <div class="card-bg p-4 rounded-xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-emerald-950 text-emerald-400 rounded-lg"><i class="fa-solid fa-clock text-lg"></i></div>
                <div>
                    <p class="text-xs text-gray-400">Next Daily Profit</p>
                    <p class="font-bold text-emerald-400">Rs 800.00</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400">Countdown</p>
                <p class="font-mono text-sm font-bold text-emerald-300" id="timer">15h 33m 20s</p>
            </div>
        </div>

        <!-- Quick Summary Grid -->
        <div class="grid grid-cols-3 gap-3 text-center">
            <div class="card-bg p-3 rounded-xl">
                <p class="text-xs text-gray-400">Total Deposit</p>
                <p class="font-bold text-sm text-white mt-1">Rs 3,470</p>
            </div>
            <div class="card-bg p-3 rounded-xl">
                <p class="text-xs text-gray-400">Withdrawals</p>
                <p class="font-bold text-sm text-white mt-1">Rs 3,134</p>
            </div>
            <div class="card-bg p-3 rounded-xl">
                <p class="text-xs text-gray-400">Referral Comm.</p>
                <p class="font-bold text-sm text-white mt-1">Rs 734</p>
            </div>
        </div>

        <!-- Referral Link Section -->
        <div class="card-bg p-4 rounded-xl flex items-center justify-between">
            <div>
                <p class="font-bold text-sm">Invite & Earn</p>
                <p class="text-xs text-gray-400">Share link with friends to get rewards</p>
            </div>
            <button onclick="copyReferral()" class="btn-green px-4 py-2 rounded-lg text-xs font-semibold">
                Copy Link
            </button>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 card-bg border-t border-emerald-900/50 p-2 flex justify-around text-center text-xs">
        <a href="#" class="text-emerald-400 flex flex-col items-center"><i class="fa-solid fa-house text-base"></i><span>Home</span></a>
        <a href="#" class="text-gray-400 flex flex-col items-center hover:text-emerald-400"><i class="fa-solid fa-chart-line text-base"></i><span>Plans</span></a>
        <a href="#" class="text-gray-400 flex flex-col items-center hover:text-emerald-400"><i class="fa-solid fa-gift text-base"></i><span>Rewards</span></a>
        <a href="#" class="text-gray-400 flex flex-col items-center hover:text-emerald-400"><i class="fa-solid fa-user text-base"></i><span>Profile</span></a>
    </div>

    <script>
        function copyReferral() {
            navigator.clipboard.writeText(window.location.href + "?ref=hasnain8576");
            alert("Referral link copied to clipboard!");
        }

        // Countdown timer simulation
        let hours = 15, minutes = 33, seconds = 20;
        setInterval(() => {
            if (seconds > 0) seconds--;
            else {
                seconds = 59;
                if (minutes > 0) minutes--;
                else { minutes = 59; if (hours > 0) hours--; }
            }
            document.getElementById('timer').innerText = `${hours}h ${minutes}m ${seconds}s`;
        }, 1000);
    </script>
</body>
</html>
